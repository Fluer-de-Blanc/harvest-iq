<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HarvestIQ - E-Hanap</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f1f8e9, #dcedc8);
      margin: 0;
      padding: 0;
      color: #2e7d32;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav.navbar {
      background-color: #388e3c;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    nav.navbar .logo {
      font-weight: bold;
      font-size: 1.5rem;
      user-select: none;
    }

    nav.navbar ul.nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav.navbar ul.nav-links li a {
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    nav.navbar ul.nav-links li a:hover,
    nav.navbar ul.nav-links li a:focus {
      text-decoration: underline;
      color: #a5d6a7;
      outline: none;
    }

    .search-container {
      max-width: 700px;
      margin: 2rem auto;
      text-align: center;
      width: 90%;
    }

    .search-container input[type="text"] {
      width: 70%;
      max-width: 400px;
      padding: 12px 15px;
      font-size: 1rem;
      border-radius: 25px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .search-container input[type="text"]:focus {
      border-color: #4caf50;
      box-shadow: 0 0 5px #4caf50;
    }

    .search-container button {
      padding: 12px 20px;
      background-color: #4caf50;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
      transition: background-color 0.3s ease;
    }

    .search-container button:hover,
    .search-container button:focus {
      background-color: #388e3c;
      outline: none;
    }

    .products-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 2rem auto 4rem;
      padding: 0 20px;
      width: 90%;
    }

    .product-card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease;
    }

    .product-card:hover,
    .product-card:focus-within {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }

    .product-card img {
      max-width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 15px;
      user-select: none;
    }

    .product-name {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 8px;
      color: #2e7d32;
    }

    .product-description {
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 10px;
      flex-grow: 1;
    }

    .product-price {
      font-size: 1rem;
      font-weight: bold;
      color: #388e3c;
      margin-bottom: 12px;
    }

    .add-button {
      background-color: #4caf50;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 25px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background-color 0.3s ease;
      user-select: none;
    }

    .add-button:hover,
    .add-button:focus {
      background-color: #388e3c;
      outline: none;
    }

    p.no-products {
      text-align: center;
      font-weight: bold;
      color: #888;
      margin-top: 2rem;
      user-select: none;
    }

    @media (max-width: 480px) {
      .search-container input[type="text"] {
        width: 100%;
        max-width: 100%;
        margin-bottom: 10px;
      }

      .search-container button {
        width: 100%;
        margin-left: 0;
      }

      nav.navbar {
        flex-wrap: wrap;
        gap: 10px;
      }

      nav.navbar ul.nav-links {
        width: 100%;
        justify-content: center;
        gap: 15px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar" role="navigation" aria-label="Primary navigation">
    <div class="logo" tabindex="0">HarvestIQ</div>
      <ul class="nav-links">
        <li><a href="ehanap.html">E-Hanap</a></li>
        <li><a href="ebili.html">E-Bili</a></li>
        <li><a href="cart.html">Cart</a></li>
        <li><a href="checkbook.html">track</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="index.html">Logout</a></li>
      </ul>
  </nav>

  <div class="search-container" role="search" aria-label="Product search">
    <input
      type="text"
      id="searchInput"
      placeholder="Search for products, e.g. tomato..."
      oninput="performSearch()"
      aria-label="Search products"
    />
    <button type="button" onclick="performSearch()">Search</button>
  </div>

  <main>
    <div class="products-list" id="productsList" aria-live="polite"></div>
  </main>

  <script>
    const allProducts = [
      {
        id: 1,
        name: "Fresh Tomato",
        description: "Locally grown, juicy tomatoes.",
        price: 50,
        image: "https://via.placeholder.com/250x150?text=Tomato",
      },
      {
        id: 2,
        name: "Sample Mango",
        description: "Sweet and ripe mangoes.",
        price: 99,
        image: "https://via.placeholder.com/250x150?text=Mango",
      },
      {
        id: 3,
        name: "Red Onion",
        description: "Organic red onions for your cooking.",
        price: 30,
        image: "https://via.placeholder.com/250x150?text=Onion",
      },
    ];

    const seasonalProducts = {
      wet: ["rice", "taro", "sugarcane", "bananas", "coconut", "water spinach"],
      dry: ["corn", "mango", "tomato", "squash", "eggplant", "beans", "sweet potato", "cassava"],
    };

    const aiSearchMap = {
      winter: ["Sample Mango", "Fresh Tomato"],
      lalabassss: ["Sample Mango", "Fresh Tomato"],
      watermelon: ["Sample Mango", "Fresh Tomato"],
      tomato: ["Fresh Tomato"],
      mango: ["Sample Mango"],
      onion: ["Red Onion"],
      onions: ["Red Onion"],
    };

    const productsList = document.getElementById("productsList");
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function getAdminProducts() {
      return JSON.parse(localStorage.getItem("products")) || [];
    }

    function getAllProducts() {
      const adminProducts = getAdminProducts();
      let maxId = allProducts.reduce((max, p) => Math.max(max, p.id), 0);
      const adminWithIds = adminProducts.map((p, index) => ({
        id: maxId + index + 1,
        name: p.name,
        description: p.description,
        price: Number(p.price),
        image: p.image || "https://via.placeholder.com/250x150?text=Product",
      }));
      return [...allProducts, ...adminWithIds];
    }

    function renderProducts(products) {
      productsList.innerHTML = "";
      if (products.length === 0) {
        productsList.innerHTML = "<p class='no-products'>No products found.</p>";
        return;
      }
      products.forEach((product) => {
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <img src="${product.image}" alt="Image of ${product.name}" />
          <div class="product-name">${product.name}</div>
          <div class="product-description">${product.description}</div>
          <div class="product-price">₱${product.price.toFixed(2)}</div>
          <button class="add-button" type="button" onclick="addToCart(${product.id})" aria-label="Add ${product.name} to cart">Add to Cart</button>
        `;
        productsList.appendChild(card);
      });
    }

    function performSearch() {
      const keyword = document.getElementById("searchInput").value.trim().toLowerCase();
      const allProds = getAllProducts();

      let filtered = allProds.filter(
        (p) =>
          p.name.toLowerCase().includes(keyword) ||
          p.description.toLowerCase().includes(keyword)
      );

      const mappedKeyword = keyword === "fry" ? "dry" : keyword;

      if (filtered.length === 0 && (mappedKeyword === "wet" || mappedKeyword === "dry")) {
        const seasonalNames = seasonalProducts[mappedKeyword];
        filtered = allProds.filter((p) =>
          seasonalNames.some((name) => p.name.toLowerCase().includes(name))
        );
      }

      if (filtered.length === 0 && aiSearchMap[keyword]) {
        filtered = allProds.filter((p) => aiSearchMap[keyword].includes(p.name));
      }

      renderProducts(filtered);
    }

    function addToCart(productId) {
      const allProds = getAllProducts();
      const product = allProds.find((p) => p.id === productId);
      if (!product) return;

      const existing = cart.find((item) => item.id === productId);
      if (existing) {
        existing.quantity = (existing.quantity || 1) + 1;
      } else {
        cart.push({ ...product, quantity: 1 });
      }
      localStorage.setItem("cart", JSON.stringify(cart));
      alert(`${product.name} added to cart!`);
    }

    // Initial render
    renderProducts(getAllProducts());
  </script>
</body>
</html>
