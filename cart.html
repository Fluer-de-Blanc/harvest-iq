<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HarvestIQ - Cart</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f1f8e9, #dcedc8);
      color: #2e7d32;
    }

    nav.navbar {
      background-color: #388e3c;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav.navbar .logo {
      font-weight: bold;
      font-size: 1.5rem;
    }

    nav.navbar ul.nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }

    nav.navbar ul.nav-links li a {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    nav.navbar ul.nav-links li a:hover {
      text-decoration: underline;
    }

    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #2e7d32;
    }

    .cart-item {
      border: 1px solid #c8e6c9;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      background: #f9fff9;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .cart-item img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .item-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .item-name {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2e7d32;
    }

    .item-description {
      font-size: 0.95rem;
      color: #555;
      margin: 5px 0;
    }

    .item-price {
      color: #388e3c;
      font-weight: bold;
      margin: 10px 0;
    }

    .remove-button {
      align-self: flex-start;
      background-color: #c62828;
      color: white;
      padding: 8px 14px;
      border: none;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .remove-button:hover {
      background-color: #b71c1c;
    }

    .checkout-section {
      text-align: right;
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
    }

    .total-price {
      font-weight: bold;
      font-size: 1.2rem;
      color: #1b5e20;
    }

    .checkout-button {
      background-color: #4CAF50;
      color: white;
      padding: 12px 22px;
      border: none;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .checkout-button:hover {
      background-color: #388e3c;
    }

    .empty-message {
      text-align: center;
      color: #888;
      font-style: italic;
      font-size: 1rem;
    }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="logo">HarvestIQ</div>
  <ul class="nav-links">
    <li><a href="ehanap.html">E-Hanap</a></li>
    <li><a href="ebili.html">E-Bili</a></li>
    <li><a href="cart.html">Cart</a></li>
    <li><a href="dashboard.html">Dashboard</a></li>
    <li><a href="index.html">Logout</a></li>
  </ul>
</nav>

<main>
  <h1>Your Cart</h1>
  <div id="cartContainer"></div>

  <div class="checkout-section" id="checkoutSection" style="display: none;">
    <span class="total-price" id="totalPrice"></span>
    <button class="checkout-button" onclick="checkout()">Checkout</button>
  </div>
</main>

<script>
  const cartContainer = document.getElementById('cartContainer');
  let cart = JSON.parse(localStorage.getItem('cart')) || [];

  function renderCart() {
    cartContainer.innerHTML = '';

    if (cart.length === 0) {
      cartContainer.innerHTML = '<p class="empty-message">Your cart is empty.</p>';
      document.getElementById('checkoutSection').style.display = 'none';
      return;
    }

    let total = 0;

    cart.forEach((item, index) => {
      const itemDiv = document.createElement('div');
      itemDiv.className = 'cart-item';

      const price = parseFloat(item.price);
      total += price * (item.quantity || 1);

      itemDiv.innerHTML = `
        <img src="${item.image || 'https://via.placeholder.com/150'}" alt="${item.name}" />
        <div class="item-info">
          <div>
            <div class="item-name">${item.name}</div>
            <div class="item-description">${item.description || ''}</div>
            <div class="item-price">₱${price.toFixed(2)} x ${item.quantity || 1}</div>
          </div>
          <button class="remove-button" onclick="removeItem(${index})">Remove</button>
        </div>
      `;

      cartContainer.appendChild(itemDiv);
    });

    document.getElementById('checkoutSection').style.display = 'flex';
    document.getElementById('totalPrice').textContent = `Total: ₱${total.toFixed(2)}`;
  }

  function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('cart', JSON.stringify(cart));
    renderCart();
  }

  function checkout() {
    if(cart.length === 0) {
      alert('Your cart is empty!');
      return;
    }

    sessionStorage.setItem('checkoutCart', JSON.stringify(cart));
    window.location.href = 'checkout.html';
  }

  renderCart();
</script>

</body>
</html>
